[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "comfyui-worldlabs-atlas"
version = "0.1.0"
description = "World Labs Atlas for ComfyUI: create worlds, render new camera views, expand and export meshes. Includes a plain-Python client and an optional MCP server."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "szprivate" }]
requires-python = ">=3.10"
dependencies = ["requests", "numpy", "Pillow"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
mesh = ["OpenEXR"]          # reading Atlas depth maps, needed to build world.glb / PLY
mcp = ["mcp"]
test = ["pytest"]

[project.urls]
Repository = "https://github.com/szprivate/ComfyUI-WorldLabsAtlas"
Issues = "https://github.com/szprivate/ComfyUI-WorldLabsAtlas/issues"

[project.scripts]
worldlabs-atlas-mcp = "worldlabs_atlas.mcp_server:main"

[tool.setuptools]
packages = ["worldlabs_atlas"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# Comfy Registry (https://registry.comfy.org). PublisherId is the publisher you create on the registry;
# ComfyUI-ImageViewer uses "sebastianzilius".
[tool.comfy]
PublisherId = "sebastianzilius"   # TODO: confirm against the publisher created at registry.comfy.org
DisplayName = "WorldLabs Atlas"
Icon = ""
includes = []
